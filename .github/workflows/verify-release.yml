name: Verify public release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7

      - name: Validate release assets
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

          test -f release-assets/supershadowmountplusflz.elf
          test -f release-assets/supershadowmountplusflz.elf.sha256

          (
            cd release-assets
            sha256sum -c supershadowmountplusflz.elf.sha256
          )

          source_count="$(find release-assets -maxdepth 1 -type f \( -name '*source*.tar.gz' -o -name '*source*.tar.xz' -o -name '*source*.zip' \) | wc -l)"
          if [ "$source_count" -lt 1 ]; then
            echo "::error::Corresponding-source archive is missing from the release."
            exit 1
          fi

          expected_checksum="$(awk '{print $1}' release-assets/supershadowmountplusflz.elf.sha256)"
          expected_version="${TAG%%-ssmplusflz-r*}"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/supershadowmountplusflz.elf"

          jq -e --arg checksum "$expected_checksum" \
                --arg version "$expected_version" \
                --arg url "$expected_url" '
            .name == "Super Shadowmount Plus FLZ by @FLZZilla" and
            (.payloads | type == "array") and
            ([
              .payloads[] |
              select(.id == "super-shadowmount-plus-flz") |
              .name == "Super Shadowmount Plus FLZ by @FLZZilla" and
              .filename == "supershadowmountplusflz.elf" and
              .url == $url and
              .version == $version and
              .checksum == $checksum
            ] | any)
          ' payloads.json >/dev/null

          echo "Release $TAG passed asset, SHA-256, and Payload Manager manifest verification."

      - name: Manual workflow check
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Public release verification workflow is installed and valid."
